services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8123:8123"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      AGENT_URL: http://backend:8123
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
