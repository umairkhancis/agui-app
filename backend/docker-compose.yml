services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENT_PORT:-8123}:8123"
    env_file:
      - .env
    environment:
      - AGENT_PORT=8123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8123/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
